[project]
name = "vpo"
version = "0.3.0"
description = "Agregador de alquiler protegido en la Comunidad de Madrid"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema[format-nongpl]>=4.23",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "pymupdf>=1.24,<2",
    "selectolax>=1.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
