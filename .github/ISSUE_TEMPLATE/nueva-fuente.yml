name: Proponer una fuente
description: Una web con promociones de alquiler protegido en la Comunidad de Madrid que no recogemos
title: "Nueva fuente: "
labels: ["nueva-fuente"]
body:
  - type: markdown
    attributes:
      value: |
        **No incluyas datos personales.** Las issues son públicas y se quedan en el historial.
        No escribas nombres, DNI, teléfonos ni correos de particulares, y no adjuntes listados de
        solicitantes, admitidos, excluidos o adjudicatarios.
  - type: input
    id: operador
    attributes:
      label: Operador o entidad
      placeholder: Empresa municipal de vivienda de...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Página pública con las promociones
      description: Sin registro ni contraseña.
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: municipios
    attributes:
      label: Municipios
  - type: dropdown
    id: bases
    attributes:
      label: ¿Publica las bases en PDF?
      options:
        - "Sí"
        - "No"
        - No lo sé
    validations:
      required: true
  - type: textarea
    id: notas
    attributes:
      label: Notas
  - type: checkboxes
    id: privacidad
    attributes:
      label: Datos personales
      options:
        - label: He comprobado que no incluyo datos personales míos ni de otras personas.
          required: true
