name: deploy

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "!data/sources/**"] # human changes (overrides, web)
  workflow_dispatch:
  workflow_call: # to be invoked by scrape.yml (Phase 5)

# A caller of this workflow must grant these same permissions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The head of the branch, not the commit that started the run: scrape.yml pushes first.
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: scraper/uv.lock
      # Apply data/overrides.json to what is published (ADR-001 §3). Nothing is committed.
      - name: Merge and validate data
        working-directory: scraper
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python -m vpo merge
          uv run --no-sync python -m vpo validate

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true # web/package.json needs a recent 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run validate-data
          npm test
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
